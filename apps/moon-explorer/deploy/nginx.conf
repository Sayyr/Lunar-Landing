# Exemple Nginx pour le site statique « Lune 3D ».
# root = dossier apps/moon-explorer déployé (avec data/ généré par setup.sh).
server {
    listen 80;
    server_name _;
    root /srv/moon-explorer;
    index index.html;

    # gzip : utile pour le TIFF float32 non compressé et le JSON ; inutile pour le JPEG.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/tiff image/svg+xml;

    types {
        image/tiff tif tiff;
    }

    # HTML/JS/CSS : toujours revalidés (ETag), pour que les mises à jour soient visibles.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Gros fichiers dont le contenu ne change jamais sous le même nom.
    location ~* ^/data/.+\.(tif|tiff|jpg|jpeg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        sendfile on;
        tcp_nopush on;
    }

    # Noms IAU : régénérables, cache plus court.
    location = /data/features.json {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Ne pas servir les téléchargements bruts ni les empreintes.
    location ~ ^/data/(raw/|SHA256SUMS) { return 404; }
    location ~ ^/(scripts|tests|deploy)/ { return 404; }
}
