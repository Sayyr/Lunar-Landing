[package]
name = "selene-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "SELENE API gateway: validation, orchestration and stable REST contracts. No astronomy math here."

[dependencies]
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
jsonschema = { version = "0.33.0", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
