[package]
name = "lunar-landing"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: science numbers must cross the gateway bit-for-bit (no astronomy in Rust).
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
jsonschema = { version = "0.33.0", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
