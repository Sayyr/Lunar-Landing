server {
  listen 80;
  root /usr/share/nginx/html;

  # gzip: useful for the uncompressed float32 TIFF and JSON; pointless for JPEG/PNG.
  # (rules ported from apps/moon-explorer/deploy/nginx.conf)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/tiff image/svg+xml;
  # image/tiff for .tif is already in nginx's default mime.types.

  # /api/* -> Rust gateway (prefix stripped), same as the Vite dev proxy.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_read_timeout 60s;
  }

  # Vite build output: content-hashed file names, safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Large data files whose content never changes under the same name (scripts/setup-data.sh).
  location ~* ^/data/.+\.(tif|tiff|jpg|jpeg|png)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    sendfile on;
    tcp_nopush on;
  }

  # IAU names: regenerable, shorter cache.
  location = /data/features.json {
    add_header Cache-Control "public, max-age=86400" always;
  }

  # SPA: HTML always revalidated so updates show up.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
