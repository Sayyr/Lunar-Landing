server {
  listen 80;
  root /usr/share/nginx/html;

  # gzip: useful for the uncompressed float32 TIFF and JSON; pointless for JPEG/PNG.
  # (rules ported from apps/moon-explorer/deploy/nginx.conf)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/tiff image/svg+xml application/octet-stream;
  # image/tiff for .tif is already in nginx's default mime.types.

  # /api/* -> Rust gateway (prefix stripped), same as the Vite dev proxy.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_read_timeout 60s;
  }

  # Vite build output: content-hashed file names, safe to cache forever.
  # No `always` on the long caches: a 404 (file not installed yet) must not be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Large data files whose content never changes under the same name (scripts/setup-data.sh).
  location ~* ^/data/.+\.(tif|tiff|jpg|jpeg|png|f32|u16)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    sendfile on;
    tcp_nopush on;
  }

  # ldem_16 band index: regenerated with the bands, short cache.
  location ~ ^/data/ldem_16/manifest\.json$ {
    add_header Cache-Control "public, max-age=86400" always;
  }

  # IAU names: regenerable, shorter cache.
  location = /data/features.json {
    add_header Cache-Control "public, max-age=86400" always;
  }

  # SPA: HTML always revalidated so updates show up.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
