# Local deployment: docker compose -f infra/compose.yaml up --build
# Then open http://localhost:8081 (web), API on :8080, science on :8000.
name: selene

services:
  science:
    build:
      context: ..
      dockerfile: services/science/Dockerfile
    environment:
      SELENE_KERNEL_DIR: /data/kernels
      # Raw LOLA DEM for POST /terrain/slope/check (missing on the host -> status dem_unavailable).
      SELENE_DEM_PATH: /data/dem/ldem_85s_20m_float.img
      # Slope check elsewhere on the Moon (scripts/setup-slope-dem.sh, ~53 GB, run once on the host):
      # SLDEM2015 tiles for 60S-60N, then the 60 m polar products. Missing files are logged and skipped.
      SELENE_SLDEM_DIR: /data/slope/sldem2015
      SELENE_SLOPE_DEM_PATHS: /data/slope/polar/ldem_60s_60m_float.img:/data/slope/polar/ldem_60n_60m_float.img
    volumes:
      # Kernels are NOT in the image; mount them read-only (see data/README.md).
      - ../data/kernels:/data/kernels:ro
      - ../apps/web/data-raw/lola_polar:/data/dem:ro
      - ../data/dem:/data/slope:ro
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      SELENE_SCIENCE_URL: http://science:8000
    volumes:
      - ../services/api/config/profiles.json:/etc/lunar-landing/profiles.json:ro
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    depends_on:
      science:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports: ["8081:80"]
    restart: unless-stopped
    volumes:
      # Locally generated polar products (apps/web/scripts/POLAR_DATA.md), ~1.2 GB each: mounted
      # read-only instead of copied into the image. Missing on the host → empty dirs → the front
      # reports "not installed".
      - ../apps/web/public/data/polar_s:/usr/share/nginx/html/data/polar_s:ro
      - ../apps/web/public/data/polar_s_slope:/usr/share/nginx/html/data/polar_s_slope:ro
      # NOT polar_s_grid: the South-pole slope grid is built into the image (apps/web/Dockerfile,
      # "grid" stage); mounting a host directory here would hide it.
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
