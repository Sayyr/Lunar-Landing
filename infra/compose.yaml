# Local deployment: docker compose -f infra/compose.yaml up --build
# Then open http://localhost:8081 (web), API on :8080, science on :8000.
name: selene

services:
  science:
    build:
      context: ..
      dockerfile: services/science/Dockerfile
    environment:
      SELENE_KERNEL_DIR: /data/kernels
    volumes:
      # Kernels are NOT in the image; mount them read-only (see data/README.md).
      - ../data/kernels:/data/kernels:ro
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      SELENE_API_BIND: 0.0.0.0:8080
      SELENE_SCIENCE_URL: http://science:8000
      RUST_LOG: info
    ports: ["8080:8080"]
    depends_on:
      science:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports: ["8081:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
